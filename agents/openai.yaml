interface:
  display_name: "Mint 动态汇报"
  short_description: "把粗略中文材料做成有逻辑、有动效的 Mint 互动 HTML"
  brand_color: "#087C66"
  default_prompt: "使用 $mint-report-html。请先完整读取我提供的任务卡和原始材料，只使用材料中的事实、数字和结论，不要联网补写或自行删除内容。先按独立管理问题合并页面，再选择与真实数据关系匹配的表格、图表、流程或关系图。请一次生成我负责的完整章节，输出一个16:9、无页眉页脚页码、可离线发送、按E可编辑全部正式文字及表格/图表/图片/关系图、可用于最终合并的 .mint-section.html。个人阶段不要生成PPTX/PDF；如有事实冲突、材料缺失或真实容量冲突，请明确列出并停止猜测。"
